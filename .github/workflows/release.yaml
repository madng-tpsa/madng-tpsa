name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-wheels:
    if: github.repository == 'madng-tpsa/madng-tpsa'
    name: Build wheels for ${{ matrix.pyver }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # cp315 requires cibuildwheel >= 4.3, which builds CPython 3.15
        # wheels by default.
        pyver: [cp311, cp312, cp313, cp314, cp315]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install GCC on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          compiler_version="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
          compiler_environment="MACOSX_DEPLOYMENT_TARGET=11.0 CC=gcc-${compiler_version}"
          compiler_environment+=" CXX=g++-${compiler_version}"
          echo "CIBW_ENVIRONMENT_MACOS=${compiler_environment}" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: ${{ matrix.pyver }}-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: dnf install -y lapack-devel openblas-devel

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.pyver }}
          path: wheelhouse/*.whl

  build-sdist:
    if: github.repository == 'madng-tpsa/madng-tpsa'
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    if: github.repository == 'madng-tpsa/madng-tpsa'
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
