[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    "cffi",
    "numpy",
]

[project]
name = "madng-tpsa"
authors = [
    {name = "Bernardo Abreu Figueiredo", email = "bernardo.abreu.figueiredo@cern.ch"},
    {name = "Laurent Deniau", email = "laurent.deniau@cern.ch"},
    {name = "Szymon Łopaciuk", email = "szymon.lopaciuk@cern.ch"},
]
dynamic = ["version"]
description = "Python bindings to the GTPSA (truncated power series) engine of MAD-NG"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cffi",
    "numpy",
    "scipy",
    "rich",
]

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-github-actions-annotate-failures",
    "ruff==0.15.17",
    "ty==0.0.63",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.scikit-build]
wheel.packages = ["src/madng_tpsa"]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/madng_tpsa/_version.py"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "src/madng_tpsa/_version.py",
    "madng/src/mad_*.c",
    "madng/src/mad_*.h",
    "madng/src/mad_*.hpp",
    "madng/src/sse/**",
    "madng/src/libgtpsa/mad_*.c",
    "madng/src/libgtpsa/*.h",
]

[project.entry-points.xobjects]
build_info = "madng_tpsa.xobjects_hook:get_build_info"

[tool.pytest]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
data_file = "coverage"
omit = ["*/_version.py"]
parallel = true
relative_files = true
source = ["src"]

[tool.ruff]
exclude = ["madng"]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    "F",  # Pyflakes rules
    "W",  # PyCodeStyle warnings
    "E",  # PyCodeStyle errors
    "D",  # pydocstyle rules
    "I",  # Sort imports properly
    "A",  # Detect shadowed builtins
    "B",  # Bugbear: finds likely bugs and design problems
    "N",  # enforce naming conventions, e.g. ClassName vs function_name
    "UP",  # Warn if certain things can change due to newer Python versions
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "FA",  # Enforce from __future__ import annotations
    "FBT",  # detect boolean traps
    "BLE",  # disallow catch-all exceptions
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "NPY",  # Some numpy-specific things
    "ARG",  # Unused arguments
    "EM101",  # Don't use string literals in exceptions
    "PIE",  # Misc rules, incl. useless kwargs and lambdas
    "T100",  # Leftover debugger calls
    "T20",  # Leftover print calls
]
ignore = [
    "D105",  # Missing docstring in magic method
]
pydocstyle.convention = "numpy"
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T20"]
"tests/test_*.py" = ["D"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["madng"]
